<ion-tabs>
  <ion-tab-bar slot="bottom" class="ion-no-border">
    <ion-tab-button tab="home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Início</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="orders">
      <div class="tab-icon-wrapper">
        <ion-icon name="receipt-outline"></ion-icon>
        @if (serviceOrderService.activeOrdersCount() > 0) {
          <ion-badge class="tab-badge-counter">{{ serviceOrderService.activeOrdersCount() }}</ion-badge>
        }
      </div>
      <ion-label>Serviços</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="calendario">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Calendário</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
