<div class="agenda-container">
  @if (isLoading()) {
    <div class="loading-state">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Carregando agenda...</p>
    </div>
  } @else {
    <div class="calendar-wrapper ion-padding">
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>
  }
</div>
